[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentresolve-crewai-demo"
version = "0.1.0"
description = "An executable CrewAI Flow showing agreement-gated AgentResolve task delivery"
requires-python = ">=3.11,<3.14"
dependencies = ["crewai==1.15.27"]
license = "MIT"

[project.scripts]
agentresolve-demo = "agentresolve_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
